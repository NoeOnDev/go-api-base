# Corre make check (gofmt, sqlc al día, go vet, tests con PostgreSQL y govulncheck)
# en cada push a main y en cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: go_api_base
          POSTGRES_PASSWORD: go_api_base
          POSTGRES_DB: go_api_base_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U go_api_base"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Base descartable del contenedor de CI; las credenciales no son secretas.
      # Solo hace falta TEST_DATABASE_URL: los tests no usan DATABASE_URL.
      TEST_DATABASE_URL: postgres://go_api_base:go_api_base@localhost:5432/go_api_base_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: make check
        run: make check
