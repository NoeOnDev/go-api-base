# Runs make check (gofmt, sqlc up to date, go vet, staticcheck, tests with PostgreSQL and govulncheck)
# on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: go_api_base
          POSTGRES_PASSWORD: go_api_base
          POSTGRES_DB: go_api_base_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U go_api_base"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway database of the CI container; the credentials are not secret.
      # Only TEST_DATABASE_URL is needed: the tests do not use DATABASE_URL.
      TEST_DATABASE_URL: postgres://go_api_base:go_api_base@localhost:5432/go_api_base_test?sslmode=disable
      # Test key (not secret): it only encrypts data of the throwaway CI database.
      ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: make check
        run: make check
