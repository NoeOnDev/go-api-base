# The API on a single server: the API, PostgreSQL and Caddy, which gives it HTTPS. See
# docs/deploy.md.
#
#   cp .env.example .env    # and fill it in
#   docker compose up -d --build
#
# Only Caddy is reachable from outside (ports 80 and 443). The API and the database have no
# published port: they talk on the private network of this file.

services:
  api:
    build:
      context: ..
    # To run an image built somewhere else (a registry), set API_IMAGE and leave out --build.
    image: ${API_IMAGE:-api:local}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/app?sslmode=disable
      # Caddy is in front and tells the real IP of each client. The API trusts it because the
      # connection comes from this private network, and its port is not published.
      TRUST_PROXY: "true"
      STORAGE_DIR: /data/storage
    volumes:
      # The uploaded files, with STORAGE_DRIVER=local. With s3 it stays empty.
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    # More than SHUTDOWN_TIMEOUT (10s): the requests and the jobs in progress finish before the stop.
    stop_grace_period: 30s

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: app
    volumes:
      # From PostgreSQL 18 the image keeps the data under /var/lib/postgresql (before, in
      # /var/lib/postgresql/data): mounted anywhere else, the data is lost with the container.
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      # 80 and 443, unless .env says otherwise (to try it on a machine where they are taken).
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The build of the frontend, if this server also serves it (see the Caddyfile).
      - ./site:/srv/site:ro
      # The certificates. Without this volume Caddy asks for them again on each start, and the
      # authority limits how many it gives.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  db:
  storage:
  caddy_data:
  caddy_config:
