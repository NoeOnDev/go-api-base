# The contract of the API: every route, its parameters and its responses (see docs/openapi.md).
#
# It is written by hand, and the tests keep it true: every response of the integration tests is
# checked against it (testutil.Do), and every route of the code must be here (internal/openapi).
# When a route, a field or an error changes, change it here in the same commit.
openapi: 3.0.3
info:
  title: API
  version: '1'
  description: |-
    The routes of the API, their parameters and their responses.

    A session is a cookie the login sets: send it with each request (`credentials: "include"` from another origin).
    Every error has the same shape (`Error`), with a `code` for the code of the frontend and a `message` for the person,
    in the language of `Accept-Language`. Any route can also answer `400` (a body that is not valid JSON), `429`
    (too many requests; see `Retry-After`) and `500`: they are the `default` response of each one. A request that
    changes something (`POST`, `PUT`, `DELETE`) and comes from the page of an origin that is not allowed answers
    `403 cross_origin_rejected`, on any route.
tags:
- {name: Account}
- {name: Sessions}
- {name: Two-factor}
- {name: Users}
- {name: Roles}
- {name: Real time}
- {name: Notifications}
- {name: Files}
- {name: Notes}
- {name: Catalog}
- {name: Branches}
- {name: Appointments}
- {name: Shifts}
- {name: Classes}
- {name: API}
security:
- {session: []}
paths:
  /auth/register:
    post:
      operationId: register
      tags: [Account]
      summary: Create an account and start its session
      description: 'Public. Errors: `409 email_taken`.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: {type: string}
                email: {type: string}
                password: {type: string}
                time_zone: {type: string, description: An IANA name like America/Mexico_City.}
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      operationId: login
      tags: [Account]
      summary: Start a session
      description: 'Public. It sets the session cookie. Errors: `401 invalid_credentials`, `403 account_suspended`, `429 too_many_requests`.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 'The account has 2FA: the session starts with POST /auth/two-factor/challenge.'
                required: [two_factor_required]
                properties:
                  two_factor_required: {type: boolean}
                additionalProperties: false
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      operationId: logout
      tags: [Account]
      summary: Close the session
      description: Public. It deletes the cookie, also when the session had already expired.
      security: []
      responses:
        '204': {description: 'Done, without a body.'}
        default: {$ref: '#/components/responses/Error'}
  /auth/me:
    get:
      operationId: getMe
      tags: [Account]
      summary: The account of the session
      description: With a session, even without a verified email.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updateMe
      tags: [Account]
      summary: Edit the profile
      description: 'With a session, even without a verified email. It replaces the name; the language and the time zone change only if they are sent.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                locale: {type: string, description: 'One of the languages of the API. An empty text goes back to the default; `null`, or leaving it out, keeps the one the user has.', nullable: true}
                time_zone: {type: string, description: "An IANA name. An empty text goes back to the application's; `null`, or leaving it out, keeps the one the user has.", nullable: true}
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteMe
      tags: [Account]
      summary: Delete the account
      description: 'With a session, even without a verified email. Errors: `409 last_admin`, `409 account_has_data`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, description: 'The account''s own password, to confirm.'}
              additionalProperties: false
      responses:
        '204': {description: 'Done, without a body.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/password:
    put:
      operationId: changePassword
      tags: [Account]
      summary: Change the password
      description: 'With a session (and a verified email, if `REQUIRE_EMAIL_VERIFICATION` is on). It closes the other sessions.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password]
              properties:
                current_password: {type: string}
                password: {type: string}
              additionalProperties: false
      responses:
        '204': {description: 'Done, without a body.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [Account]
      summary: Ask for a link to reset the password
      description: Public. It answers the same whether the email is registered or not.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string}
              additionalProperties: false
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, description: 'A text for the user, in the language of the request.'}
                additionalProperties: false
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [Account]
      summary: Set a new password with the link
      description: Public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string, description: The token of the link that arrived by email.}
                password: {type: string}
              additionalProperties: false
      responses:
        '204': {description: 'Done, without a body.'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/email:
    put:
      operationId: requestEmailChange
      tags: [Account]
      summary: Ask to change the email
      description: 'With a session, even without a verified email. The change happens when the link sent to the new address is opened. Errors: `409 email_taken`, `429 too_many_emails`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string, description: 'The account''s own password, to confirm.'}
              additionalProperties: false
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, description: 'A text for the user, in the language of the request.'}
                additionalProperties: false
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/email/confirm:
    post:
      operationId: confirmEmailChange
      tags: [Account]
      summary: Confirm the new email with the link
      description: 'Public. Errors: `409 email_taken`.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, description: The token of the link that arrived by email.}
              additionalProperties: false
      responses:
        '204': {description: 'Done, without a body.'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/email/verify:
    post:
      operationId: verifyEmail
      tags: [Account]
      summary: Verify the email with the link
      description: Public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, description: The token of the link that arrived by email.}
              additionalProperties: false
      responses:
        '204': {description: 'Done, without a body.'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/email/resend:
    post:
      operationId: resendVerification
      tags: [Account]
      summary: Send the verification link again
      description: 'With a session, even without a verified email. `204` if the email is already verified. Errors: `429 too_many_emails`.'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string, description: 'A text for the user, in the language of the request.'}
                additionalProperties: false
        '204': {description: 'Done, without a body.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
  /auth/invitation/accept:
    post:
      operationId: acceptInvitation
      tags: [Account]
      summary: Accept an invitation and choose the password
      description: Public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string, description: The token of the link that arrived by email.}
                password: {type: string}
                time_zone: {type: string, description: An IANA name like America/Mexico_City., nullable: true}
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/sessions:
    get:
      operationId: listSessions
      tags: [Sessions]
      summary: The sessions of the account, per device
      description: With a session, even without a verified email.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Session'}
                additionalProperties: false
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [Sessions]
      summary: Close another session
      description: With a session, even without a verified email.
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
      responses:
        '204': {description: 'Done, without a body.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      tags: [Sessions]
      summary: Close every other session
      description: With a session, even without a verified email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, description: 'The account''s own password, to confirm.'}
              additionalProperties: false
      responses:
        '204': {description: 'Done, without a body.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/two-factor/setup:
    post:
      operationId: setupTwoFactor
      tags: [Two-factor]
      summary: Get the secret to add the account to an authenticator app
      description: 'With a session (and a verified email, if `REQUIRE_EMAIL_VERIFICATION` is on). Errors: `409 two_factor_already_enabled`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_url]
                properties:
                  secret: {type: string}
                  otpauth_url: {type: string, description: The address the QR code carries.}
                additionalProperties: false
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Error'}
  /auth/two-factor/enable:
    post:
      operationId: enableTwoFactor
      tags: [Two-factor]
      summary: Turn on 2FA with a code of the app
      description: 'With a session (and a verified email, if `REQUIRE_EMAIL_VERIFICATION` is on). Errors: `409 two_factor_setup_required`, `409 two_factor_secret_changed`, `409 two_factor_already_enabled`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, password]
              properties:
                code: {type: string}
                password: {type: string, description: 'The account''s own password, to confirm.'}
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: They are shown only this time.
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: {type: string}
                additionalProperties: false
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/two-factor/disable:
    post:
      operationId: disableTwoFactor
      tags: [Two-factor]
      summary: Turn off 2FA
      description: 'With a session (and a verified email, if `REQUIRE_EMAIL_VERIFICATION` is on). With a code of the app or a recovery code. Errors: `409 two_factor_not_enabled`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, description: 'The account''s own password, to confirm.'}
                code: {type: string}
                recovery_code: {type: string}
              additionalProperties: false
      responses:
        '204': {description: 'Done, without a body.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/two-factor/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [Two-factor]
      summary: Get new recovery codes
      description: 'With a session (and a verified email, if `REQUIRE_EMAIL_VERIFICATION` is on). Errors: `409 two_factor_not_enabled`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, description: 'The account''s own password, to confirm.'}
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: They are shown only this time.
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: {type: string}
                additionalProperties: false
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /auth/two-factor/challenge:
    post:
      operationId: twoFactorChallenge
      tags: [Two-factor]
      summary: Second step of the login
      description: 'Public. After a login that answered `202`: that answer set the `two_factor_challenge` cookie, which the browser sends here by itself. Errors: `401 two_factor_challenge_expired`, `401 two_factor_locked`.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: {type: string}
                recovery_code: {type: string}
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /admin/users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: The users
      description: Administrators only.
      parameters:
      - name: q
        in: query
        schema: {type: string}
        description: Searches the name and the email.
      - name: role
        in: query
        schema: {type: string}
      - name: status
        in: query
        schema: {type: string, enum: [active, invited, suspended]}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AdminUser'}
                  meta: {$ref: '#/components/schemas/PageMeta'}
                additionalProperties: false
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: inviteUser
      tags: [Users]
      summary: Invite a user
      description: 'Administrators only. The person chooses their password from the link that arrives by email. Errors: `409 email_taken`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: {type: string}
                email: {type: string}
                role: {type: string}
                locale: {type: string, nullable: true}
                time_zone: {type: string, description: An IANA name like America/Mexico_City., nullable: true}
                password: {type: string, description: 'The administrator''s own, to invite with any role other than `user`.'}
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /admin/users/{id}:
    get:
      operationId: getUser
      tags: [Users]
      summary: A user
      description: Administrators only.
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete a user
      description: 'Administrators only. Errors: `409 own_account`, `409 last_admin`, `409 account_has_data`.'
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, description: 'The account''s own password, to confirm.'}
              additionalProperties: false
      responses:
        '204': {description: 'Done, without a body.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /admin/users/{id}/role:
    put:
      operationId: changeUserRole
      tags: [Users]
      summary: Change the role of a user
      description: 'Administrators only. Errors: `409 own_account`, `409 last_admin`.'
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, password]
              properties:
                role: {type: string}
                password: {type: string, description: 'The account''s own password, to confirm.'}
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /admin/users/{id}/suspend:
    post:
      operationId: suspendUser
      tags: [Users]
      summary: Suspend a user
      description: 'Administrators only. Errors: `409 own_account`, `409 last_admin`.'
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Error'}
  /admin/users/{id}/unsuspend:
    post:
      operationId: unsuspendUser
      tags: [Users]
      summary: Lift the suspension
      description: 'Administrators only. Errors: `409 own_account`.'
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
