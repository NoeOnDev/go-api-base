# sqlc generates typed Go code from plain SQL.
# - schema: reads the goose migrations to learn what the tables look like (it ignores the Down sections).
#   It includes River's, so internal/store also has their types (RiverJob…): don't use them,
#   River is talked to through its own client (internal/jobs).
# - queries: the queries you write, each with a "-- name: Name :kind" comment.
# To regenerate after changing migrations or queries: make sqlc
version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        # Empty lists return [] instead of nil.
        emit_empty_slices: true
        # Nullable columns are generated as pointers (*string) instead of pgtype.Text.
        emit_pointers_for_null_types: true
        # Initialisms written in uppercase in Go names (UserID, TOTPSecret).
        initialisms: ["id", "totp", "ip"]
        overrides:
          # Dates are generated as time.Time instead of pgtype.Timestamptz,
          # and as *time.Time if the column is nullable.
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          # jsonb is generated as json.RawMessage: it is stored and returned as is, without decoding.
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          # interval is generated as time.Duration (pgx converts it on its own).
          - db_type: "pg_catalog.interval"
            go_type: "time.Duration"
